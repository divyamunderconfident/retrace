[project]
name = "retrace"
version = "0.0.1"
description = "A time-travel debugger for AI agents"
requires-python = ">=3.11"
dependencies = ["requests"]

[project.optional-dependencies]
dev = ["pytest"]

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["retrace"]

[tool.pytest.ini_options]
pythonpath = ["."]
